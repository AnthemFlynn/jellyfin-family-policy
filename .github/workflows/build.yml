name: Build and verify
on:
  push:
    branches: [family-policy]
  pull_request:
    branches: [family-policy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/FamilyPolicy.Core.Tests/FamilyPolicy.Core.Tests.csproj --locked-mode
      - run: dotnet test tests/FamilyPolicy.Core.Tests/FamilyPolicy.Core.Tests.csproj -c Release --no-restore --logger trx
      - run: dotnet restore src/FamilyPolicy.Plugin/FamilyPolicy.Plugin.csproj --locked-mode
      - run: dotnet build src/FamilyPolicy.Plugin/FamilyPolicy.Plugin.csproj -c Release --no-restore
      - run: dotnet restore src/FamilyPolicy.Guard/FamilyPolicy.Guard.csproj --locked-mode
      - run: dotnet build src/FamilyPolicy.Guard/FamilyPolicy.Guard.csproj -c Release --no-restore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
  integration:
    name: Native acceptance Jellyfin ${{ matrix.server.version }}
    strategy:
      fail-fast: false
      matrix:
        server:
          - {version: '12.1', ref: ee91c75e777da41a9c4f4855e70adc604fbf2ef8}
          - {version: '12.2', ref: ca0f16eb7c195f720a1493ed469a27c4657db0c6}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jellyfin/jellyfin
          ref: ${{ matrix.server.ref }}
          path: .test-server
      - name: Prepare pinned runtime tools
        run: |
          mkdir -p .test-ffmpeg
          curl --fail --location --silent --show-error https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-1/jellyfin-ffmpeg_8.1.3-1_portable_linux64-gpl.tar.xz -o .test-ffmpeg/archive.tar.xz
          echo 'b86dc023c64a5a9a410e6e3a938a970460214fae78f31c1553c9f88f1c289b6a  .test-ffmpeg/archive.tar.xz' | sha256sum --check
          tar -xf .test-ffmpeg/archive.tar.xz -C .test-ffmpeg
          pip install -r tests/integration/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build adapter and unmodified test server
        run: |
          dotnet restore src/FamilyPolicy.Plugin/FamilyPolicy.Plugin.csproj --locked-mode
          dotnet build src/FamilyPolicy.Plugin/FamilyPolicy.Plugin.csproj -c Release --no-restore
          dotnet restore src/FamilyPolicy.Guard/FamilyPolicy.Guard.csproj --locked-mode
          dotnet build src/FamilyPolicy.Guard/FamilyPolicy.Guard.csproj -c Release --no-restore
          dotnet build .test-server/Jellyfin.Server/Jellyfin.Server.csproj -c Release -p:RunAnalyzers=false
      - name: Native API, media, browser and recovery acceptance
        env:
          FAMILY_POLICY_BROWSER_TESTS: '1'
        run: |
          export DOTNET_EXE="$(command -v dotnet)"
          export JELLYFIN_SERVER_DLL="$PWD/.test-server/Jellyfin.Server/bin/Release/net10.0/jellyfin.dll"
          export JELLYFIN_FFMPEG="$PWD/.test-ffmpeg/ffmpeg"
          python tests/integration/run.py > integration-results.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-integration-results-${{ matrix.server.version }}
          path: integration-results.json

  guard-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -f src/FamilyPolicy.Guard/Dockerfile -t family-policy-guard:test .
      - name: Non-root container runtime smoke
        run: |
          set +e
          timeout 5 docker run --rm -e FAMILY_POLICY_SERVER=http://127.0.0.1:1 -e FAMILY_POLICY_TOKEN=synthetic-test-value -e FAMILY_POLICY_USERS=11111111-1111-1111-1111-111111111111 family-policy-guard:test > guard-smoke.log 2>&1
          result=$?
          set -e
          test "$result" -eq 124
          rg 'Family Policy guard started' guard-smoke.log
